<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Transient Heat Transfer Simulator</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Helvetica Neue', Arial, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: #000000;
        }

        .header {
            background: #000000;
            color: #ffffff;
            padding: 20px 40px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.8em;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0;
        }

        .header p {
            font-size: 0.85em;
            opacity: 0.6;
            font-weight: 400;
            margin: 0;
        }

        .content {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 80px);
        }

        .input-panel {
            background: #000000;
            padding: 20px 40px;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            display: block;
            color: #999;
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #333;
            border-radius: 2px;
            font-size: 0.9em;
            transition: border-color 0.2s, background-color 0.2s;
            background: #111;
            color: #fff;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #fff;
            background: #1a1a1a;
        }

        .input-group select {
            cursor: pointer;
        }

        .input-group small {
            display: none;
        }

        .boundary-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .boundary-group input {
            font-size: 0.85em;
            padding: 6px 10px;
        }

        .action-bar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            padding: 10px 24px;
            background: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            border-radius: 2px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn:hover {
            background: #000000;
            color: #ffffff;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background: #333;
            border-color: #333;
            color: #666;
            cursor: not-allowed;
        }

        .btn-stop {
            background: #ff0000;
            border-color: #ff0000;
            color: #ffffff;
        }

        .btn-stop:hover {
            background: #cc0000;
            border-color: #cc0000;
        }

        .btn-gif {
            background: transparent;
            border-color: #ffffff;
            color: #ffffff;
        }

        .btn-gif:hover {
            background: #ffffff;
            color: #000000;
        }

        .gif-preview {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 30px;
            background: #000;
            border: 1px solid #fff;
            text-align: center;
            display: none;
            z-index: 1000;
            max-width: 90%;
            max-height: 90%;
        }

        .gif-preview h3 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .gif-preview img {
            max-width: 100%;
            border: 1px solid #333;
        }

        .gif-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-small {
            padding: 8px 20px;
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            border-radius: 2px;
            font-size: 0.75em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-small:hover {
            background: #fff;
            color: #000;
        }

        .visualization-panel {
            background: #000;
            padding: 20px 40px;
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #plot {
            width: 100%;
            height: 100%;
            flex: 1;
        }

        .status {
            display: flex;
            gap: 30px;
            padding: 10px 0;
            border-top: 1px solid #333;
            margin-top: 10px;
        }

        .status-item {
            display: flex;
            gap: 10px;
            font-size: 0.75em;
        }

        .status-label {
            color: #666;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-value {
            color: #fff;
            font-family: 'Courier New', monospace;
        }

        @media (max-width: 1024px) {
            .controls-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>2D Heat Transfer</h1>
                <p>Finite Difference Method Simulator</p>
            </div>
        </div>

        <div class="content">
            <div class="input-panel">
                <div class="controls-grid">

                    <div class="input-group">
                        <label>Length [m]</label>
                        <input type="number" id="length" value="1.0" step="0.1" min="0.1">
                    </div>

                    <div class="input-group">
                        <label>Width [m]</label>
                        <input type="number" id="width" value="1.0" step="0.1" min="0.1">
                    </div>

                    <div class="input-group">
                        <label>Top Temp [°C]</label>
                        <input type="number" id="temp_top" value="100" step="1">
                    </div>

                    <div class="input-group">
                        <label>Bottom Temp [°C]</label>
                        <input type="number" id="temp_bottom" value="0" step="1">
                    </div>

                    <div class="input-group">
                        <label>Left Temp [°C]</label>
                        <input type="number" id="temp_left" value="27" step="1">
                    </div>

                    <div class="input-group">
                        <label>Right Temp [°C]</label>
                        <input type="number" id="temp_right" value="27" step="1">
                    </div>

                    <div class="input-group">
                        <label>Material</label>
                        <select id="material_preset" onchange="loadMaterialProperties()">
                            <option value="custom">Custom</option>
                            <option value="carbon_steel" selected>Carbon Steel</option>
                            <option value="aluminum">Aluminum</option>
                            <option value="abs_plastic">ABS Plastic</option>
                            <option value="ceramic">Ceramic</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Conductivity [W/m·K]</label>
                        <input type="number" id="conductivity" value="50" step="1" min="0.01" onchange="setCustomMaterial()">
                    </div>

                    <div class="input-group">
                        <label>Density [kg/m³]</label>
                        <input type="number" id="density" value="7850" step="100" min="1" onchange="setCustomMaterial()">
                    </div>

                    <div class="input-group">
                        <label>Specific Heat [J/kg·K]</label>
                        <input type="number" id="specific_heat" value="490" step="10" min="1" onchange="setCustomMaterial()">
                    </div>

                    <div class="input-group">
                        <label>Simulation Time [s]</label>
                        <input type="number" id="sim_time" value="100" step="10" min="1">
                    </div>

                    <div class="input-group">
                        <label>Grid X</label>
                        <input type="number" id="grid_x" value="50" step="5" min="10" max="200">
                    </div>

                    <div class="input-group">
                        <label>Grid Y</label>
                        <input type="number" id="grid_y" value="50" step="5" min="10" max="200">
                    </div>
                </div>

                <div class="action-bar">
                    <button class="btn" id="startBtn" onclick="startSimulation()">Start</button>
                    <button class="btn btn-stop" id="stopBtn" onclick="stopSimulation()" disabled>Stop</button>
                    <button class="btn btn-gif" id="gifBtn" onclick="exportGIF()" disabled>Export GIF</button>

                    <div style="flex: 1;"></div>

                    <div class="status-item">
                        <span class="status-label">Status</span>
                        <span class="status-value" id="statusText">Ready</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Time</span>
                        <span class="status-value" id="timeText">0.00 s</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Progress</span>
                        <span class="status-value" id="progressText">0%</span>
                    </div>
                </div>
            </div>

            <div class="visualization-panel">
                <div id="plot"></div>
                <div class="status">
                    <div class="status-item">
                        <span class="status-label">Δt</span>
                        <span class="status-value" id="dtText">-</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Fourier</span>
                        <span class="status-value" id="fourierText">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="gif-preview" id="gifPreview">
        <h3>Generated GIF</h3>
        <img id="gifImage" src="" alt="Generated GIF">
        <div class="gif-actions">
            <button class="btn-small" onclick="downloadGIF()">Download</button>
            <button class="btn-small" onclick="closeGifPreview()">Close</button>
        </div>
    </div>

    <script>
        let animationId = null;
        let isRunning = false;
        let capturedFrames = [];
        let frameCaptureTimes = [];
        let gifEncoder = null;
        let gifBlob = null;  // Store the generated GIF blob

        // Material properties database
        const materialProperties = {
            carbon_steel: {
                name: 'Carbon Steel',
                conductivity: 50,
                density: 7850,
                specific_heat: 490
            },
            aluminum: {
                name: 'Aluminum',
                conductivity: 205,
                density: 2700,
                specific_heat: 900
            },
            abs_plastic: {
                name: 'ABS Plastic',
                conductivity: 0.2,
                density: 1050,
                specific_heat: 1400
            },
            ceramic: {
                name: 'Ceramic',
                conductivity: 2.5,
                density: 2500,
                specific_heat: 900
            }
        };

        // Load material properties when preset is selected
        function loadMaterialProperties() {
            const preset = document.getElementById('material_preset').value;

            if (preset === 'custom') {
                return; // Don't change values for custom
            }

            const material = materialProperties[preset];
            if (material) {
                document.getElementById('conductivity').value = material.conductivity;
                document.getElementById('density').value = material.density;
                document.getElementById('specific_heat').value = material.specific_heat;
            }
        }

        // Set to custom when user manually changes values
        function setCustomMaterial() {
            document.getElementById('material_preset').value = 'custom';
        }

        class HeatTransferSolver {
            constructor(params) {
                this.L = params.length;           // Length in x
                this.W = params.width;            // Width in y
                this.k = params.conductivity;     // Thermal conductivity
                this.rho = params.density;        // Density
                this.cp = params.specific_heat;   // Specific heat

                // Convert Celsius to Kelvin for calculations
                this.T_top = params.temp_top + 273.15;
                this.T_bottom = params.temp_bottom + 273.15;
                this.T_left = params.temp_left + 273.15;
                this.T_right = params.temp_right + 273.15;

                this.totalTime = params.sim_time;
                this.nx = params.grid_x;
                this.ny = params.grid_y;

                // Calculate thermal diffusivity
                this.alpha = this.k / (this.rho * this.cp);

                // Grid spacing
                this.dx = this.L / (this.nx - 1);
                this.dy = this.W / (this.ny - 1);

                // Time step (stability criterion: Fo_x + Fo_y <= 0.5)
                const fo_limit = 0.4; // Use 0.4 for safety margin
                this.dt = fo_limit / (this.alpha * (1/(this.dx*this.dx) + 1/(this.dy*this.dy)));

                this.Fo_x = this.alpha * this.dt / (this.dx * this.dx);
                this.Fo_y = this.alpha * this.dt / (this.dy * this.dy);

                // Initialize temperature field
                this.T = this.initializeTemperature();
                this.currentTime = 0;
            }

            initializeTemperature() {
                // Initialize with linear interpolation between boundaries
                const T = [];
                for (let i = 0; i < this.nx; i++) {
                    T[i] = [];
                    for (let j = 0; j < this.ny; j++) {
                        // Linear interpolation from boundaries
                        const x_ratio = i / (this.nx - 1);
                        const y_ratio = j / (this.ny - 1);

                        // Average of boundary influences
                        const T_x = (1 - x_ratio) * this.T_left + x_ratio * this.T_right;
                        const T_y = (1 - y_ratio) * this.T_bottom + y_ratio * this.T_top;

                        T[i][j] = (T_x + T_y) / 2;
                    }
                }

                // Set boundary conditions
                this.applyBoundaryConditions(T);
                return T;
            }

            applyBoundaryConditions(T) {
                // Left boundary (x = 0)
                for (let j = 0; j < this.ny; j++) {
                    T[0][j] = this.T_left;
                }
                // Right boundary (x = L)
                for (let j = 0; j < this.ny; j++) {
                    T[this.nx - 1][j] = this.T_right;
                }
                // Bottom boundary (y = 0)
                for (let i = 0; i < this.nx; i++) {
                    T[i][0] = this.T_bottom;
                }
                // Top boundary (y = W)
                for (let i = 0; i < this.nx; i++) {
                    T[i][this.ny - 1] = this.T_top;
                }
            }

            step() {
                const T_new = [];

                // Copy old values
                for (let i = 0; i < this.nx; i++) {
                    T_new[i] = [...this.T[i]];
                }

                // Update interior points using explicit finite difference
                for (let i = 1; i < this.nx - 1; i++) {
                    for (let j = 1; j < this.ny - 1; j++) {
                        const d2T_dx2 = this.T[i+1][j] - 2*this.T[i][j] + this.T[i-1][j];
                        const d2T_dy2 = this.T[i][j+1] - 2*this.T[i][j] + this.T[i][j-1];

                        T_new[i][j] = this.T[i][j] +
                                      this.Fo_x * d2T_dx2 +
                                      this.Fo_y * d2T_dy2;
                    }
                }

                // Apply boundary conditions
                this.applyBoundaryConditions(T_new);

                this.T = T_new;
                this.currentTime += this.dt;
            }

            getTemperatureField(inCelsius = true) {
                // Return temperature field in format for Plotly (transposed for correct orientation)
                const z = [];
                for (let j = this.ny - 1; j >= 0; j--) {
                    const row = [];
                    for (let i = 0; i < this.nx; i++) {
                        // Convert to Celsius for display
                        const temp = inCelsius ? this.T[i][j] - 273.15 : this.T[i][j];
                        row.push(temp);
                    }
                    z.push(row);
                }
                return z;
            }
        }

        let solver = null;

        function startSimulation() {
            if (isRunning) return;

            // Get parameters (temperatures in Celsius)
            const params = {
                length: parseFloat(document.getElementById('length').value),
                width: parseFloat(document.getElementById('width').value),
                temp_top: parseFloat(document.getElementById('temp_top').value),
                temp_bottom: parseFloat(document.getElementById('temp_bottom').value),
                temp_left: parseFloat(document.getElementById('temp_left').value),
                temp_right: parseFloat(document.getElementById('temp_right').value),
                conductivity: parseFloat(document.getElementById('conductivity').value),
                density: parseFloat(document.getElementById('density').value),
                specific_heat: parseFloat(document.getElementById('specific_heat').value),
                sim_time: parseFloat(document.getElementById('sim_time').value),
                grid_x: parseInt(document.getElementById('grid_x').value),
                grid_y: parseInt(document.getElementById('grid_y').value)
            };

            // Initialize solver
            solver = new HeatTransferSolver(params);

            // Reset frame capture
            capturedFrames = [];
            frameCaptureTimes = [];

            // Hide GIF preview from previous run
            document.getElementById('gifPreview').style.display = 'none';

            // Update UI
            isRunning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('gifBtn').disabled = true;
            document.getElementById('statusText').textContent = 'Running...';
            document.getElementById('dtText').textContent = solver.dt.toExponential(3) + ' s';
            document.getElementById('fourierText').textContent =
                `Fo_x=${solver.Fo_x.toFixed(4)}, Fo_y=${solver.Fo_y.toFixed(4)}, Sum=${(solver.Fo_x + solver.Fo_y).toFixed(4)}`;

            // Initialize plot
            initializePlot(solver);

            // Start animation
            animate();
        }

        function stopSimulation() {
            isRunning = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;

            // GIF button is already enabled during animation if frames exist
            document.getElementById('statusText').textContent = 'Stopped';
        }

        function initializePlot(solver) {
            const z = solver.getTemperatureField(true);  // Get in Celsius

            // Find min and max temperature for color scale (in Celsius)
            const allTemps = [
                solver.T_top - 273.15,
                solver.T_bottom - 273.15,
                solver.T_left - 273.15,
                solver.T_right - 273.15
            ];
            const T_min = Math.min(...allTemps);
            const T_max = Math.max(...allTemps);

            const data = [{
                z: z,
                type: 'heatmap',
                colorscale: [
                    [0, 'rgb(0,0,131)'],      // Deep blue (cold)
                    [0.2, 'rgb(0,60,170)'],
                    [0.4, 'rgb(5,255,255)'],  // Cyan
                    [0.6, 'rgb(255,255,0)'],  // Yellow
                    [0.8, 'rgb(250,0,0)'],    // Red
                    [1, 'rgb(128,0,0)']       // Dark red (hot)
                ],
                zmin: T_min,
                zmax: T_max,
                colorbar: {
                    title: {
                        text: 'T [°C]',
                        font: { color: '#999', size: 11 }
                    },
                    titleside: 'right',
                    tickmode: 'linear',
                    tick0: T_min,
                    dtick: (T_max - T_min) / 10,
                    tickfont: { color: '#666', size: 10 },
                    outlinecolor: '#333',
                    outlinewidth: 1,
                    bgcolor: '#000'
                }
            }];

            const layout = {
                title: {
                    text: `t = ${solver.currentTime.toFixed(2)} s`,
                    font: { color: '#ffffff', size: 14, family: 'monospace' },
                    x: 0.02,
                    xanchor: 'left'
                },
                xaxis: {
                    title: { text: 'x [m]', font: { color: '#999', size: 11 } },
                    range: [0, solver.L],
                    tickmode: 'linear',
                    tick0: 0,
                    dtick: solver.L / 5,
                    gridcolor: '#222',
                    zerolinecolor: '#333',
                    color: '#666'
                },
                yaxis: {
                    title: { text: 'y [m]', font: { color: '#999', size: 11 } },
                    range: [0, solver.W],
                    tickmode: 'linear',
                    tick0: 0,
                    dtick: solver.W / 5,
                    scaleanchor: 'x',
                    gridcolor: '#222',
                    zerolinecolor: '#333',
                    color: '#666'
                },
                paper_bgcolor: '#000000',
                plot_bgcolor: '#000000',
                autosize: true,
                margin: { t: 40, r: 120, b: 50, l: 60 }
            };

            const config = {
                responsive: true,
                displayModeBar: true,
                displaylogo: false
            };

            Plotly.newPlot('plot', data, layout, config);
        }

        function updatePlot(solver) {
            const z = solver.getTemperatureField(true);  // Get in Celsius

            Plotly.update('plot', {
                z: [z]
            }, {
                'title.text': `t = ${solver.currentTime.toFixed(2)} s`
            });
        }

        function animate() {
            if (!isRunning || solver.currentTime >= solver.totalTime) {
                if (solver.currentTime >= solver.totalTime) {
                    stopSimulation();
                    document.getElementById('statusText').textContent = 'Completed';
                }
                return;
            }

            // Perform multiple steps per frame for speed
            const stepsPerFrame = 10;
            for (let i = 0; i < stepsPerFrame && solver.currentTime < solver.totalTime; i++) {
                solver.step();
            }

            // Update plot every frame
            updatePlot(solver);

            // Capture frame for GIF (limit to 30 frames for faster GIF generation on mobile)
            if (capturedFrames.length < 30 && Math.floor(solver.currentTime / solver.totalTime * 30) > capturedFrames.length) {
                captureFrame();
            }

            // Enable GIF button as soon as we have frames
            if (capturedFrames.length > 0 && document.getElementById('gifBtn').disabled) {
                document.getElementById('gifBtn').disabled = false;
            }

            // Update status
            document.getElementById('timeText').textContent = solver.currentTime.toFixed(2) + ' s';
            const progress = (solver.currentTime / solver.totalTime * 100).toFixed(1);
            document.getElementById('progressText').textContent = progress + '%';

            animationId = requestAnimationFrame(animate);
        }

        async function captureFrame() {
            const plotDiv = document.getElementById('plot');

            // Convert plot to image data (reduced resolution for faster GIF encoding)
            const imgData = await Plotly.toImage(plotDiv, {
                format: 'png',
                width: 640,
                height: 480
            });

            capturedFrames.push(imgData);
            frameCaptureTimes.push(solver.currentTime);
        }

        async function exportGIF() {
            if (capturedFrames.length === 0) {
                alert('No frames captured. Please run a simulation first.');
                return;
            }

            document.getElementById('gifBtn').disabled = true;
            document.getElementById('statusText').textContent = 'Creating GIF (0%)...';

            try {
                // Create GIF encoder (workers: 0 = no web workers, runs on main thread)
                // This avoids cross-origin security warnings on iOS Safari/Firefox
                // Optimized settings: reduced resolution, medium quality for faster encoding
                const gif = new GIF({
                    workers: 0,
                    quality: 20,  // 1-30 scale, higher = faster but lower quality (20 = medium)
                    width: 640,
                    height: 480
                });

                // Add frames to GIF with progress indicator
                for (let i = 0; i < capturedFrames.length; i++) {
                    const img = new Image();
                    await new Promise((resolve) => {
                        img.onload = () => {
                            // Create canvas to draw image
                            const canvas = document.createElement('canvas');
                            canvas.width = 640;
                            canvas.height = 480;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0);

                            // Add frame with delay
                            gif.addFrame(canvas, {delay: 200});  // 200ms per frame

                            // Update progress
                            const progress = Math.round((i + 1) / capturedFrames.length * 50);
                            document.getElementById('statusText').textContent = `Creating GIF (${progress}%)...`;

                            resolve();
                        };
                        img.src = capturedFrames[i];
                    });
                }

                // Show rendering progress
                gif.on('progress', (progress) => {
                    const percent = Math.round(50 + progress * 50); // 50-100%
                    document.getElementById('statusText').textContent = `Creating GIF (${percent}%)...`;
                });

                // Render GIF
                gif.on('finished', (blob) => {
                    // Store blob for download later
                    gifBlob = blob;

                    // Display GIF in preview
                    const url = URL.createObjectURL(blob);
                    const gifImage = document.getElementById('gifImage');
                    gifImage.src = url;

                    // Show preview section
                    document.getElementById('gifPreview').style.display = 'block';

                    document.getElementById('statusText').textContent = 'GIF created!';
                    document.getElementById('gifBtn').disabled = false;

                    // Scroll to preview
                    document.getElementById('gifPreview').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                });

                // Update status before rendering starts
                document.getElementById('statusText').textContent = 'Creating GIF (50%)...';
                gif.render();

            } catch (error) {
                console.error('Error creating GIF:', error);
                alert('Error creating GIF: ' + error.message);
                document.getElementById('gifBtn').disabled = false;
                document.getElementById('statusText').textContent = 'Error creating GIF';
            }
        }

        function downloadGIF() {
            if (!gifBlob) {
                alert('No GIF available to download.');
                return;
            }

            // Download GIF
            const url = URL.createObjectURL(gifBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'heat_transfer_simulation.gif';
            a.click();
            URL.revokeObjectURL(url);
        }

        function closeGifPreview() {
            document.getElementById('gifPreview').style.display = 'none';

            // Clean up old blob URL
            const gifImage = document.getElementById('gifImage');
            if (gifImage.src) {
                URL.revokeObjectURL(gifImage.src);
                gifImage.src = '';
            }
        }
    </script>
</body>
</html>
